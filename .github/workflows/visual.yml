name: visual

# Visual regression tests run on every PR. They require a working
# build, so the CI job builds the app, starts `vite preview`, and runs
# Playwright against it. Update the baseline with --update-snapshots
# when intentionally changing the visual layout.

on:
  pull_request:
    branches: [main]

jobs:
  visual:
    name: Playwright visual regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install OS deps for Playwright
        run: npx playwright install-deps chromium

      - name: Install npm deps
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install chromium

      - name: Build
        working-directory: client
        run: npm run build

      - name: Visual regression tests
        working-directory: client
        run: npm run test:visual

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/test-results
          retention-days: 7
